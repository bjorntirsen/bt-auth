services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bt_auth
      POSTGRES_USER: bt_auth
      POSTGRES_PASSWORD: bt_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bt_auth -d bt_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
